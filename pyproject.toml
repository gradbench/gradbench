[project]
name = "gradbench-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dataclasses-json = ["dataclasses-json~=0.6"]
futhark-server = ["futhark-server~=1.0"]
gradbench = ["gradbench"]
jax = ["jax~=0.4"]
numpy = ["numpy~=1.0"]
pydantic = ["pydantic~=2.0"]
ruff = ["ruff~=0.9"]
torch = ["torch~=2.0"]
tensorflow = ["tensorflow~=2.0"]
scipy = ["scipy~=1.0"]

[tool.uv]
default-groups = "all"

# Use CPU builds of the ML frameworks: GradBench runs on CPU, and the default
# Linux wheels otherwise pull in ~2 GB of CUDA (nvidia-*) wheels per framework.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
gradbench = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[tool.uv.workspace]
members = ["python/*"]

[tool.ruff.lint]
extend-select = ["I", "RUF"]
ignore = ["E741"]
