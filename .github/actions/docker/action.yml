name: Docker
runs:
  using: composite
  steps:
    - uses: crazy-max/ghaction-setup-docker@v5
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
    - uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/amd64,linux/arm64
